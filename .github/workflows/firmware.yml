name: Firmware and host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and build tools
        run: python -m pip install platformio==6.1.18 pytest

      - name: Reject tracked generated Python files
        run: test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"

      - name: Test Python host tools
        run: python -m pytest -q

      - name: Test portable firmware core
        run: python -m platformio test -e native

      - name: Build Vibe Watch firmware
        run: python -m platformio run -e m5stack-stopwatch

      - name: Publish firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeWatch-firmware
          path: .pio/build/m5stack-stopwatch/firmware.bin
          if-no-files-found: error
