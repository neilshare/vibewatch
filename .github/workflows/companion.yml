name: Companion checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show Swift toolchain
        run: swift --version

      - name: Test companion
        run: swift test --package-path companion

      - name: Build release companion
        run: swift build -c release --package-path companion
